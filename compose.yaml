name: berufe

x-api-service: &api-service
  build:
    context: ./apps/api
  image: berufe-api:development
  env_file:
    - .env
  init: true
  volumes:
    - ./apps/api:/app
    - ./apps/contracts:/contracts:ro
    - api_bundle:/usr/local/bundle
  depends_on:
    db:
      condition: service_healthy

services:
  web:
    build:
      context: ./apps/web
    image: berufe-web:development
    env_file:
      - .env
    init: true
    command: pnpm dev --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - ./apps/contracts:/contracts:ro
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *api-service
    command: bin/rails server --binding 0.0.0.0 --port 3000
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/up"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  worker:
    <<: *api-service
    command: bundle exec good_job start
    ports:
      - "7001:7001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:7001/status/started && curl --fail --silent http://localhost:7001/status/connected",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  db:
    image: postgres:18.4-bookworm
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  api_bundle:
  postgres_data:
  web_node_modules:
