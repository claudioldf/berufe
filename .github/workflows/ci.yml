name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - production

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: berufe_test
          POSTGRES_USER: berufe
          POSTGRES_PASSWORD: berufe_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U berufe -d berufe_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      CI: "true"
      RAILS_ENV: test
      BERUFE_ENV: test
      DATABASE_URL: postgresql://berufe:berufe_ci_only@localhost:5432/berufe_test
      TEST_DATABASE_URL: postgresql://berufe:berufe_ci_only@localhost:5432/berufe_test
      DB_POOL: "5"
      SMS_OTP_ADAPTER: fake
      FAKE_SMS_OTP_CODE: "123456"
      MEDIA_STORAGE_ADAPTER: local
      LOCAL_STORAGE_ROOT: /tmp/berufe-ci-storage
      WEB_ORIGIN: http://localhost:3000
      API_PUBLIC_URL: http://localhost:3001
      OPENAPI_CONTRACT_PATH: ${{ github.workspace }}/apps/contracts/openapi.yaml
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install image processing runtime
        run: sudo apt-get update && sudo apt-get install --yes libvips42

      - name: Set up Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          working-directory: apps/api
          bundler-cache: true

      - name: Check Ruby style
        run: bundle exec standardrb

      - name: Scan Rails security
        run: bundle exec brakeman --quiet --no-pager --exit-on-warn --exit-on-error

      - name: Recreate and migrate the test database
        run: |
          bin/rails db:drop db:create db:migrate
          bin/rails db:abort_if_pending_migrations

      - name: Verify Rails boot and eager loading
        run: bin/rails zeitwerk:check

      - name: Run RSpec and OpenAPI contract coverage
        run: bundle exec rspec

      - name: Verify test database seeds
        run: bin/rails db:seed

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      BERUFE_ENV: preview
      NUXT_API_INTERNAL_BASE_URL: http://127.0.0.1:3001
      NUXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3001
      NUXT_PUBLIC_SITE_URL: http://localhost:3000
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate API types
        run: pnpm api:generate

      - name: Reject generated API type drift
        run: git diff --exit-code -- app/services/api/schema.d.ts

      - name: Check repository formatting boundaries
        run: pnpm format:repo:check

      - name: Check frontend formatting
        run: pnpm format:check

      - name: Lint Vue and TypeScript
        run: pnpm lint

      - name: Lint component styles
        run: pnpm stylelint

      - name: Type-check Nuxt
        run: pnpm typecheck

      - name: Run Vitest
        run: pnpm test

      - name: Build production Nuxt application
        run: pnpm build

  integration:
    name: Compose integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create local environment file
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build Rails and Nuxt Dockerfiles
        run: docker compose build api web

      - name: Start the development stack
        run: docker compose up --detach --wait

      - name: Verify API readiness
        run: curl --fail --silent --show-error http://localhost:3001/api/v1/status

      - name: Verify Nuxt-to-Rails rendering
        run: |
          curl --fail --silent --show-error http://localhost:3000/foundation --output "${RUNNER_TEMP}/foundation.html"
          grep --fixed-strings "berufe-api" "${RUNNER_TEMP}/foundation.html"

      - name: Verify worker database connectivity
        run: curl --fail --silent --show-error http://localhost:7001/status/connected

      - name: Show service logs after a failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the integration stack
        if: always()
        run: docker compose down --volumes

  production-images:
    name: Production image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate production Compose configuration
        run: docker compose -f compose.production-smoke.yaml config --quiet

      - name: Build production images
        run: docker compose -f compose.production-smoke.yaml build api web

      - name: Start production-shaped stack
        run: docker compose -f compose.production-smoke.yaml up --detach --wait

      - name: Verify production health endpoints
        run: |
          curl --fail --silent --show-error http://localhost:3101/up
          curl --fail --silent --show-error http://localhost:3100/health

      - name: Verify production Nuxt-to-Rails rendering
        run: |
          curl --fail --silent --show-error http://localhost:3101/api/v1/status --output "${RUNNER_TEMP}/status.json"
          grep --fixed-strings "berufe-api" "${RUNNER_TEMP}/status.json"
          curl --fail --silent --show-error http://localhost:3100/foundation --output "${RUNNER_TEMP}/production-foundation.html"
          grep --fixed-strings "berufe-api" "${RUNNER_TEMP}/production-foundation.html"

      - name: Show service logs after a failure
        if: failure()
        run: docker compose -f compose.production-smoke.yaml logs --no-color

      - name: Stop the production-shaped stack
        if: always()
        run: docker compose -f compose.production-smoke.yaml down --volumes
