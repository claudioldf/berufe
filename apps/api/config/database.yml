default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("DB_POOL") %>
  checkout_timeout: 5

development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") %>

test:
  <<: *default
  url: <%= ENV["TEST_DATABASE_URL"] %>

production:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") %>
