          $ref: "#/components/schemas/RequestId"
    PublicProfessionalProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - public_slug
        - profile_type
        - claimed
        - display_name
        - headline
        - bio
        - years_experience
        - photo_url
        - services
        - coverage
        - verification_labels
        - evidence_summary
        - customer_recommendations
        - portfolio
        - relationships
        - social_links
        - public_snapshot_updated_at
        - indexable
      properties:
        id:
          type: string
          format: uuid
        public_slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        profile_type:
          type: string
          enum:
            - self_service
            - external
        claimed:
          type: boolean
        display_name:
          type: string
          minLength: 3
          maxLength: 70
        headline:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 120
        bio:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 2500
        years_experience:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 70
        photo_url:
          type:
            - string
            - "null"
          format: uri
        services:
          type: array
          items:
            $ref: "#/components/schemas/PublicProfessionalProfileService"
        coverage:
          $ref: "#/components/schemas/PublicProfessionalCoverage"
        verification_labels:
          type: array
          items:
            $ref: "#/components/schemas/PublicVerificationLabel"
        evidence_summary:
          $ref: "#/components/schemas/PublicProfessionalEvidenceSummary"
        customer_recommendations:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/PublicCustomerRecommendation"
        portfolio:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/PublicProfessionalPortfolioItem"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/PublicProfessionalRelationship"
        social_links:
          $ref: "#/components/schemas/PublicProfessionalSocialLinks"
        public_snapshot_updated_at:
          type:
            - string
            - "null"
          format: date-time
        indexable:
          type: boolean
          description: >-
            Whether Rails considers this profile substantial enough to be
            indexed by search engines (self-service, published, with a
            photo and at least one piece of evidence). External or
            unclaimed profiles are never indexable.
    PublicProfessionalEvidenceSummary:
      type: object
      additionalProperties: false
      required:
        [
          registered_services,
          recommendations,
          hidden_recommendations,
          worked_together_professionals,
        ]
      properties:
        registered_services: { type: integer, minimum: 0 }
        recommendations: { type: integer, minimum: 0 }
        hidden_recommendations: { type: integer, minimum: 0 }
        worked_together_professionals: { type: integer, minimum: 0 }
    PublicCustomerRecommendation:
