openapi: 3.1.0
info:
  title: Berufe API
  version: 1.0.0
  description: Contract for the Berufe MVP Rails API.
servers:
  - url: /
paths:
  /api/v1/auth/otp/challenges:
    post:
      operationId: requestPhoneOtp
      summary: Request a Brazilian phone OTP challenge
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneOtpRequest"
      responses:
        "201":
          description: The SMS provider accepted the challenge synchronously.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneOtpChallengeResponse"
        "422":
          description: The phone is invalid or SMS delivery was rejected.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: A Rails or provider cooldown/daily allowance was reached.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The SMS provider or challenge persistence is unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/otp/verifications:
    post:
      operationId: verifyPhoneOtp
      summary: Verify a phone OTP and create an application session
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneOtpVerificationRequest"
      responses:
        "200":
          description: The provider verified the code and Rails created an application session.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/ApplicationSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneOtpVerificationResponse"
        "422":
          description: The code or browser challenge is invalid, expired, or consumed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The provider or session persistence is unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/session:
    post:
      operationId: createAdminSession
      summary: Authenticate a deliberately provisioned administrator with email and password
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSessionRequest"
      responses:
        "200":
          description: The credentials were accepted and Rails created an administrator session.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/ApplicationSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionResponse"
        "401":
          description: The credentials are invalid or the administrator is unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The exact browser origin is invalid.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The email or source address reached its login-attempt allowance.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Administrator authentication persistence is temporarily unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/catalog:
    get:
      operationId: getPublicCatalog
      summary: Read the active service and Joinville neighborhood catalog
      tags:
        - Catalog
      security: []
      responses:
        "200":
          description: Active catalog entries in their configured order.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"
        "503":
          description: The catalog database query is temporarily unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/professional-registration:
    put:
      operationId: completeProfessionalRegistration
      summary: Accept the current legal documents and create one draft professional profile
      tags:
        - Authentication
      security:
        - applicationSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfessionalRegistrationRequest"
      responses:
        "200":
          description: Registration is complete and the account owns exactly one draft profile.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessionalRegistrationResponse"
        "401":
          description: An active Rails application session is required.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The account role, CSRF token, or exact request origin is not permitted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The display name or legal acceptance is invalid.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Registration persistence is temporarily unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/session:
    get:
      operationId: getCurrentSession
      summary: Restore the current Rails application session
      tags:
        - Authentication
      security:
        - applicationSession: []
      responses:
        "200":
          description: The active account/session summary and a newly rotated CSRF token.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSessionResponse"
        "401":
          description: The cookie is missing, unknown, expired, revoked, or belongs to a suspended account.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The authenticated account is not authorized to inspect this session.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The application-session database operation is unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: endCurrentSession
      summary: Revoke the current Rails application session
      tags:
        - Authentication
      security:
        - applicationSession: []
          csrfToken: []
      responses:
        "204":
          description: The current session was revoked and its cookie was cleared.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/ApplicationSessionCookie"
        "401":
          description: The cookie is missing, unknown, expired, revoked, or belongs to a suspended account.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The CSRF token or exact request origin is invalid.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The application-session database operation is unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/status:
    get:
      operationId: getApiStatus
      summary: Read API and database readiness
      tags:
        - Foundation
      security: []
      responses:
        "200":
          description: The API and its database are ready.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "503":
          description: The API cannot currently reach a required dependency.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    applicationSession:
      type: apiKey
      in: cookie
      name: __Host-berufe_session
      description: Opaque Rails-owned application-session cookie.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Rotating session-bound token required for authenticated mutations.
  headers:
    ApplicationSessionCookie:
      description: Host-only opaque Rails application-session cookie.
      schema:
        type: string
        minLength: 1
    RequestId:
      description: Bounded request identifier used for safe cross-service correlation.
      schema:
        $ref: "#/components/schemas/RequestId"
    RetryAfter:
      description: Whole seconds before another rate-limited request may be attempted.
      schema:
        type: integer
        minimum: 1
  parameters:
    Page:
      name: page
      in: query
      description: One-based result page.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: per_page
      in: query
      description: Result count per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Order:
      name: order
      in: query
      required: true
      description: Endpoint-specific deterministic ordering key.
      schema:
        type: string
        minLength: 1
  schemas:
    AdminSessionRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 72
    AdminSessionResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - request_id
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - status
          properties:
            status:
              type: string
              const: authenticated
        request_id:
          $ref: "#/components/schemas/RequestId"
    PhoneOtpRequest:
      type: object
      additionalProperties: false
      required:
        - phone
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 40
          description: Brazilian mobile number in national, formatted, or E.164 form.
    PhoneOtpChallengeResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - request_id
      properties:
        data:
          $ref: "#/components/schemas/PhoneOtpChallenge"
        request_id:
          $ref: "#/components/schemas/RequestId"
    PhoneOtpChallenge:
      type: object
      additionalProperties: false
      required:
        - status
        - challenge_token
        - expires_in
        - resend_available_in
      properties:
        status:
          type: string
          const: accepted
        challenge_token:
          type: string
          minLength: 40
          maxLength: 100
        expires_in:
          type: integer
          minimum: 1
        resend_available_in:
          type: integer
          minimum: 1
    PhoneOtpVerificationRequest:
      type: object
      additionalProperties: false
      required:
        - challenge_token
        - code
      properties:
        challenge_token:
          type: string
          minLength: 40
          maxLength: 100
        code:
          type: string
          pattern: "^[0-9]{6}$"
    PhoneOtpVerificationResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - request_id
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - status
          properties:
            status:
              type: string
              const: verified
        request_id:
          $ref: "#/components/schemas/RequestId"
    ProfessionalRegistrationRequest:
      type: object
      additionalProperties: false
      required:
        - display_name
        - accepted
      properties:
        display_name:
          type: string
          minLength: 3
          maxLength: 70
        accepted:
          type: boolean
    ProfessionalRegistrationResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - request_id
      properties:
        data:
          $ref: "#/components/schemas/ProfessionalRegistration"
        request_id:
          $ref: "#/components/schemas/RequestId"
    ProfessionalRegistration:
      type: object
      additionalProperties: false
      required:
        - status
        - profile
      properties:
        status:
          type: string
          const: completed
        profile:
          $ref: "#/components/schemas/RegisteredProfessionalProfile"
    RegisteredProfessionalProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - display_name
        - profile_status
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          minLength: 3
          maxLength: 70
        profile_status:
          type: string
          const: draft
    CurrentSessionResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - request_id
      properties:
        data:
          $ref: "#/components/schemas/CurrentSessionData"
        request_id:
          $ref: "#/components/schemas/RequestId"
    CurrentSessionData:
      type: object
      additionalProperties: false
      required:
        - account
        - session
        - csrf_token
      properties:
        account:
          $ref: "#/components/schemas/CurrentAccountSummary"
        session:
          $ref: "#/components/schemas/ApplicationSessionSummary"
        csrf_token:
          type: string
          minLength: 40
          maxLength: 100
    CurrentAccountSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - role
        - status
        - registration_completed
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - professional
            - admin
        status:
          type: string
          const: active
        registration_completed:
          type: boolean
    ApplicationSessionSummary:
      type: object
      additionalProperties: false
      required:
        - authentication_method
        - authenticated_at
        - idle_expires_at
        - absolute_expires_at
      properties:
        authentication_method:
          type: string
          enum:
            - sms_otp
            - password
        authenticated_at:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
        absolute_expires_at:
          type: string
          format: date-time
    CatalogResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - request_id
      properties:
        data:
          $ref: "#/components/schemas/CatalogData"
        request_id:
          $ref: "#/components/schemas/RequestId"
    CatalogData:
      type: object
      additionalProperties: false
      required:
        - categories
        - services
        - neighborhoods
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/PublicServiceCategory"
        services:
          type: array
          items:
            $ref: "#/components/schemas/PublicService"
        neighborhoods:
          type: array
          items:
            $ref: "#/components/schemas/PublicNeighborhood"
    PublicServiceCategory:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - name
        - icon
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        name:
          type: string
          minLength: 1
        icon:
          type: string
          minLength: 1
    PublicService:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - categorySlug
        - icon
        - description
        - aliases
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        categorySlug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        icon:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        aliases:
          type: array
          items:
            type: string
            minLength: 1
    PublicNeighborhood:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - stateCode
        - city
      properties:
        code:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        name:
          type: string
          minLength: 1
        stateCode:
          type: string
          const: SC
        city:
          type: string
          const: Joinville
    RequestId:
      type: string
      pattern: "^[A-Za-z0-9._-]{1,100}$"
    StatusResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - request_id
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - service
            - status
          properties:
            service:
              type: string
              const: berufe-api
            status:
              type: string
              const: ok
        request_id:
          $ref: "#/components/schemas/RequestId"
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
          pattern: "^[a-z0-9_]+$"
        message:
          type: string
          minLength: 1
        field_errors:
          type: object
          additionalProperties:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
        request_id:
          $ref: "#/components/schemas/RequestId"
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/Error"
    PageMeta:
      type: object
      additionalProperties: false
      required:
        - page
        - per_page
        - total_count
        - total_pages
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        total_count:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
security:
  - applicationSession: []
    csrfToken: []
tags:
  - name: Authentication
  - name: Catalog
  - name: Foundation
