    RequestId:
      type: string
      pattern: "^[A-Za-z0-9._-]{1,100}$"
    StatusResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - request_id
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - service
            - status
          properties:
            service:
              type: string
              const: berufe-api
            status:
              type: string
              const: ok
        request_id:
          $ref: "#/components/schemas/RequestId"
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
          pattern: "^[a-z0-9_]+$"
        message:
          type: string
          minLength: 1
        field_errors:
          type: object
          additionalProperties:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
        request_id:
          $ref: "#/components/schemas/RequestId"
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/Error"
    PageMeta:
      type: object
      additionalProperties: false
      required:
        - page
        - per_page
        - total_count
        - total_pages
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        total_count:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
security:
  - applicationSession: []
tags:
  - name: Authentication
