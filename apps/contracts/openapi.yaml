openapi: 3.1.0
info:
  title: Berufe API
  version: 1.0.0
  description: Contract for the Berufe MVP Rails API.
servers:
  - url: /
paths:
  /api/v1/auth/otp/challenges:
    post:
      operationId: requestPhoneOtp
      summary: Request a Brazilian phone OTP challenge
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneOtpRequest"
      responses:
        "201":
          description: The SMS provider accepted the challenge synchronously.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneOtpChallengeResponse"
        "403":
          description: The exact browser origin is invalid.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The phone is invalid or SMS delivery was rejected.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: A Rails or provider cooldown/daily allowance was reached.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The SMS provider or challenge persistence is unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/otp/verifications:
    post:
      operationId: verifyPhoneOtp
      summary: Verify a phone OTP and create an application session
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneOtpVerificationRequest"
      responses:
        "200":
          description: The provider verified the code and Rails created an application session.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/ApplicationSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneOtpVerificationResponse"
        "403":
          description: The exact browser origin is invalid.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The code or browser challenge is invalid, expired, or consumed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The provider or session persistence is unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/session:
    post:
      operationId: createAdminSession
      summary: Authenticate a deliberately provisioned administrator with email and password
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSessionRequest"
      responses:
        "200":
          description: The credentials were accepted and Rails created an administrator session.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/ApplicationSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionResponse"
        "401":
          description: The credentials are invalid or the administrator is unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The exact browser origin is invalid.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The email or source address reached its login-attempt allowance.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Administrator authentication persistence is temporarily unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/catalog:
    get:
      operationId: getAdminCatalog
      summary: Read the complete administrator-managed catalog
      tags:
        - Catalog
      security:
        - applicationSession: []
      responses:
        "200":
          description: Active and inactive catalog entries in their configured order.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogResponse"
        "401":
          $ref: "#/components/responses/AdminCatalogUnauthorized"
        "503":
          $ref: "#/components/responses/AdminCatalogUnavailable"
  /api/v1/admin/catalog/services:
    post:
      operationId: createAdminCatalogService
      summary: Add a service to the controlled catalog
      tags:
        - Catalog
      security:
        - applicationSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCatalogServiceCreateRequest"
      responses:
        "201":
          description: The service was appended to the controlled catalog.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogResponse"
        "401":
          $ref: "#/components/responses/AdminCatalogUnauthorized"
        "403":
          $ref: "#/components/responses/AdminCatalogForbidden"
        "404":
          $ref: "#/components/responses/AdminCatalogNotFound"
        "409":
          $ref: "#/components/responses/AdminCatalogConflict"
        "422":
          $ref: "#/components/responses/AdminCatalogInvalid"
        "503":
          $ref: "#/components/responses/AdminCatalogUnavailable"
  /api/v1/admin/catalog/services/order:
    put:
      operationId: reorderAdminCatalogServices
      summary: Persist the complete deterministic service order
      tags:
        - Catalog
      security:
        - applicationSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCatalogServiceOrderRequest"
      responses:
        "200":
          description: The complete service order was persisted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogResponse"
        "401":
          $ref: "#/components/responses/AdminCatalogUnauthorized"
        "403":
          $ref: "#/components/responses/AdminCatalogForbidden"
        "409":
          $ref: "#/components/responses/AdminCatalogConflict"
        "503":
          $ref: "#/components/responses/AdminCatalogUnavailable"
  /api/v1/admin/catalog/services/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateAdminCatalogService
      summary: Update mutable fields of a controlled service
      tags:
        - Catalog
      security:
        - applicationSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCatalogServiceUpdateRequest"
      responses:
        "200":
          description: The service was updated without changing its stable slug.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogResponse"
        "401":
          $ref: "#/components/responses/AdminCatalogUnauthorized"
        "403":
          $ref: "#/components/responses/AdminCatalogForbidden"
        "404":
          $ref: "#/components/responses/AdminCatalogNotFound"
        "422":
          $ref: "#/components/responses/AdminCatalogInvalid"
        "503":
          $ref: "#/components/responses/AdminCatalogUnavailable"
  /api/v1/admin/catalog/neighborhoods:
    post:
      operationId: createAdminCatalogNeighborhood
      summary: Add a Joinville neighborhood to the controlled catalog
      tags:
        - Catalog
      security:
        - applicationSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCatalogNeighborhoodCreateRequest"
      responses:
        "201":
          description: The neighborhood was appended to the controlled catalog.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogResponse"
        "401":
          $ref: "#/components/responses/AdminCatalogUnauthorized"
        "403":
          $ref: "#/components/responses/AdminCatalogForbidden"
        "409":
          $ref: "#/components/responses/AdminCatalogConflict"
        "422":
          $ref: "#/components/responses/AdminCatalogInvalid"
        "503":
          $ref: "#/components/responses/AdminCatalogUnavailable"
  /api/v1/admin/catalog/neighborhoods/order:
    put:
      operationId: reorderAdminCatalogNeighborhoods
      summary: Persist the complete deterministic neighborhood order
      tags:
        - Catalog
      security:
        - applicationSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCatalogNeighborhoodOrderRequest"
      responses:
        "200":
          description: The complete neighborhood order was persisted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogResponse"
        "401":
          $ref: "#/components/responses/AdminCatalogUnauthorized"
        "403":
          $ref: "#/components/responses/AdminCatalogForbidden"
        "409":
          $ref: "#/components/responses/AdminCatalogConflict"
        "503":
          $ref: "#/components/responses/AdminCatalogUnavailable"
  /api/v1/admin/catalog/neighborhoods/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 80
    patch:
      operationId: updateAdminCatalogNeighborhood
      summary: Update mutable fields of a controlled Joinville neighborhood
      tags:
        - Catalog
      security:
        - applicationSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCatalogNeighborhoodUpdateRequest"
      responses:
        "200":
          description: The neighborhood was updated without changing its stable code.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogResponse"
        "401":
          $ref: "#/components/responses/AdminCatalogUnauthorized"
        "403":
          $ref: "#/components/responses/AdminCatalogForbidden"
        "404":
          $ref: "#/components/responses/AdminCatalogNotFound"
        "409":
          $ref: "#/components/responses/AdminCatalogConflict"
        "422":
          $ref: "#/components/responses/AdminCatalogInvalid"
        "503":
          $ref: "#/components/responses/AdminCatalogUnavailable"
  /api/v1/catalog:
    get:
      operationId: getPublicCatalog
      summary: Read the active service and Joinville neighborhood catalog
      tags:
        - Catalog
      security: []
      responses:
        "200":
          description: Active catalog entries in their configured order.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"
        "503":
          description: The catalog database query is temporarily unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/professional-registration:
    put:
      operationId: completeProfessionalRegistration
      summary: Accept the current legal documents and create one draft professional profile
      tags:
        - Authentication
      security:
        - applicationSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfessionalRegistrationRequest"
      responses:
        "200":
          description: Registration is complete and the account owns exactly one draft profile.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessionalRegistrationResponse"
        "401":
          description: An active Rails application session is required.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The account role or exact request origin is not permitted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The display name or legal acceptance is invalid.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Registration persistence is temporarily unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/professional/workspace:
    get:
      operationId: getProfessionalWorkspace
      summary: Read the authenticated professional's server-owned workspace
      tags:
        - Professional supply
      security:
        - applicationSession: []
      responses:
        "200":
          description: The owned professional profile and its current editable identity.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessionalWorkspaceResponse"
        "401":
          description: An active Rails application session is required.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Professional registration has not created a profile yet.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/professional/profile:
    patch:
      operationId: updateProfessionalProfile
      summary: Persist the authenticated professional's identity and contact step
      tags:
        - Professional supply
      security:
        - applicationSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfessionalProfileUpdateRequest"
      responses:
        "200":
          description: Identity and contact data were validated, normalized, and persisted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessionalWorkspaceResponse"
        "401":
          description: An active Rails application session is required.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The exact browser origin or profile owner is invalid.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Professional registration has not created a profile yet.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: One or more identity/contact fields are invalid.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/professional/media-uploads:
    post:
      operationId: authorizeProfessionalMediaUpload
      summary: Authorize a short-lived private professional image upload
      tags:
        - Professional supply
      security:
        - applicationSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadAuthorizationRequest"
      responses:
        "201":
          description: A ten-minute private upload authorization and opaque quarantine key were created.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadAuthorizationResponse"
        "401":
          $ref: "#/components/responses/ProfessionalMediaUnauthorized"
        "403":
          $ref: "#/components/responses/ProfessionalMediaForbidden"
        "404":
          $ref: "#/components/responses/ProfessionalMediaNotFound"
        "422":
          $ref: "#/components/responses/ProfessionalMediaInvalid"
        "503":
          $ref: "#/components/responses/ProfessionalMediaUnavailable"
  /api/v1/professional/media-uploads/{id}:
    parameters:
      - $ref: "#/components/parameters/MediaUploadId"
    get:
      operationId: getProfessionalMediaUpload
      summary: Read private media processing state owned by the authenticated professional
      tags:
        - Professional supply
      security:
        - applicationSession: []
      responses:
        "200":
          description: Current authorization and asynchronous processing state.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadResponse"
        "401":
          $ref: "#/components/responses/ProfessionalMediaUnauthorized"
        "404":
          $ref: "#/components/responses/ProfessionalMediaNotFound"
  /api/v1/professional/media-uploads/{id}/content:
    parameters:
      - $ref: "#/components/parameters/MediaUploadId"
    put:
      operationId: uploadProfessionalMediaContent
      summary: Upload authorized image bytes through Rails in local and preview environments
      tags:
        - Professional supply
      security:
        - applicationSession: []
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Exact declared bytes were written to the private quarantine scope.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadResponse"
        "401":
          $ref: "#/components/responses/ProfessionalMediaUnauthorized"
        "403":
          $ref: "#/components/responses/ProfessionalMediaForbidden"
        "404":
          $ref: "#/components/responses/ProfessionalMediaNotFound"
        "409":
          $ref: "#/components/responses/ProfessionalMediaConflict"
        "422":
          $ref: "#/components/responses/ProfessionalMediaInvalid"
        "503":
          $ref: "#/components/responses/ProfessionalMediaUnavailable"
  /api/v1/professional/media-uploads/{id}/completion:
    parameters:
      - $ref: "#/components/parameters/MediaUploadId"
    post:
      operationId: completeProfessionalMediaUpload
      summary: Confirm a private upload and enqueue safe image processing
      tags:
        - Professional supply
      security:
        - applicationSession: []
      responses:
        "202":
          description: The quarantined object was verified and processing was queued.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadResponse"
        "401":
          $ref: "#/components/responses/ProfessionalMediaUnauthorized"
        "403":
          $ref: "#/components/responses/ProfessionalMediaForbidden"
        "404":
          $ref: "#/components/responses/ProfessionalMediaNotFound"
        "409":
          $ref: "#/components/responses/ProfessionalMediaConflict"
        "422":
          $ref: "#/components/responses/ProfessionalMediaInvalid"
        "503":
          $ref: "#/components/responses/ProfessionalMediaUnavailable"
  /api/v1/professional/media-uploads/{id}/retry:
    parameters:
      - $ref: "#/components/parameters/MediaUploadId"
    post:
      operationId: retryProfessionalMediaUpload
      summary: Retry transient private image processing without accepting invalid content
      tags:
        - Professional supply
      security:
        - applicationSession: []
      responses:
        "202":
          description: A transiently failed quarantined upload was queued again.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadResponse"
        "401":
          $ref: "#/components/responses/ProfessionalMediaUnauthorized"
        "403":
          $ref: "#/components/responses/ProfessionalMediaForbidden"
        "404":
          $ref: "#/components/responses/ProfessionalMediaNotFound"
        "409":
          $ref: "#/components/responses/ProfessionalMediaConflict"
        "503":
          $ref: "#/components/responses/ProfessionalMediaUnavailable"
  /api/v1/session:
    get:
      operationId: getCurrentSession
      summary: Restore the current Rails application session
      tags:
        - Authentication
      security:
        - applicationSession: []
      responses:
        "200":
          description: The active account and session summary.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSessionResponse"
        "401":
          description: The cookie is missing, unknown, expired, revoked, or belongs to a suspended account.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The authenticated account is not authorized to inspect this session.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The application-session database operation is unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: endCurrentSession
      summary: Revoke the current Rails application session
      tags:
        - Authentication
      security:
        - applicationSession: []
      responses:
        "204":
          description: The current session was revoked and its cookie was cleared.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/ApplicationSessionCookie"
        "401":
          description: The cookie is missing, unknown, expired, revoked, or belongs to a suspended account.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The exact request origin is invalid.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The application-session database operation is unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/status:
    get:
      operationId: getApiStatus
      summary: Read API and database readiness
      tags:
        - Foundation
      security: []
      responses:
        "200":
          description: The API and its database are ready.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "503":
          description: The API cannot currently reach a required dependency.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    applicationSession:
      type: apiKey
      in: cookie
      name: __Host-berufe_session
