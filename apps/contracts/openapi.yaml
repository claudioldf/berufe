openapi: 3.1.0
info:
  title: Berufe API
  version: 1.0.0
  description: Contract for the Berufe MVP Rails API.
servers:
  - url: /
paths:
  /api/v1/auth/otp/challenges:
    post:
      operationId: requestPhoneOtp
      summary: Request a Brazilian phone OTP challenge
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneOtpRequest"
      responses:
        "201":
          description: The SMS provider accepted the challenge synchronously.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneOtpChallengeResponse"
        "403":
          description: The exact browser origin is invalid.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The phone is invalid or SMS delivery was rejected.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: A Rails or provider cooldown/daily allowance was reached.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The SMS provider or challenge persistence is unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/otp/verifications:
    post:
      operationId: verifyPhoneOtp
      summary: Verify a phone OTP and create an application session
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneOtpVerificationRequest"
      responses:
        "200":
          description: The provider verified the code and Rails created an application session.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/ApplicationSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneOtpVerificationResponse"
        "403":
          description: The exact browser origin is invalid.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The code or browser challenge is invalid, expired, or consumed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The provider or session persistence is unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/session:
    post:
      operationId: createAdminSession
      summary: Authenticate a deliberately provisioned administrator with email and password
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSessionRequest"
      responses:
        "200":
          description: The credentials were accepted and Rails created an administrator session.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/ApplicationSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionResponse"
        "401":
          description: The credentials are invalid or the administrator is unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The exact browser origin is invalid.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The email or source address reached its login-attempt allowance.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Administrator authentication persistence is temporarily unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/catalog:
    get:
      operationId: getAdminCatalog
      summary: Read the complete administrator-managed catalog
      tags:
        - Catalog
      security:
        - applicationSession: []
      responses:
        "200":
          description: Active and inactive catalog entries in their configured order.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogResponse"
        "401":
          $ref: "#/components/responses/AdminCatalogUnauthorized"
        "503":
          $ref: "#/components/responses/AdminCatalogUnavailable"
  /api/v1/admin/catalog/services:
    post:
      operationId: createAdminCatalogService
      summary: Add a service to the controlled catalog
      tags:
        - Catalog
      security:
        - applicationSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCatalogServiceCreateRequest"
      responses:
        "201":
          description: The service was appended to the controlled catalog.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogResponse"
        "401":
          $ref: "#/components/responses/AdminCatalogUnauthorized"
        "403":
          $ref: "#/components/responses/AdminCatalogForbidden"
        "404":
          $ref: "#/components/responses/AdminCatalogNotFound"
        "409":
          $ref: "#/components/responses/AdminCatalogConflict"
        "422":
          $ref: "#/components/responses/AdminCatalogInvalid"
        "503":
          $ref: "#/components/responses/AdminCatalogUnavailable"
  /api/v1/admin/catalog/services/order:
    put:
      operationId: reorderAdminCatalogServices
      summary: Persist the complete deterministic service order
      tags:
        - Catalog
      security:
        - applicationSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCatalogServiceOrderRequest"
      responses:
        "200":
          description: The complete service order was persisted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogResponse"
        "401":
          $ref: "#/components/responses/AdminCatalogUnauthorized"
        "403":
          $ref: "#/components/responses/AdminCatalogForbidden"
        "409":
          $ref: "#/components/responses/AdminCatalogConflict"
        "503":
          $ref: "#/components/responses/AdminCatalogUnavailable"
  /api/v1/admin/catalog/services/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateAdminCatalogService
      summary: Update mutable fields of a controlled service
      tags:
        - Catalog
      security:
        - applicationSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCatalogServiceUpdateRequest"
      responses:
        "200":
          description: The service was updated without changing its stable slug.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogResponse"
        "401":
          $ref: "#/components/responses/AdminCatalogUnauthorized"
        "403":
          $ref: "#/components/responses/AdminCatalogForbidden"
        "404":
          $ref: "#/components/responses/AdminCatalogNotFound"
        "422":
          $ref: "#/components/responses/AdminCatalogInvalid"
        "503":
          $ref: "#/components/responses/AdminCatalogUnavailable"
  /api/v1/admin/moderation:
    get:
      operationId: getAdminModerationQueue
      summary: Read the identity-verification moderation queue
      tags:
        - Moderation
      security:
        - applicationSession: []
      parameters:
        - $ref: "#/components/parameters/ModerationStatus"
        - $ref: "#/components/parameters/ModerationSearch"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/ModerationPageSize"
      responses:
        "200":
          description: Oldest-first moderation work and server-owned summary counts.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminModerationResponse"
        "401":
          $ref: "#/components/responses/AdminModerationUnauthorized"
  /api/v1/admin/reports/growth:
    get:
      operationId: getAdminGrowthReport
      summary: Read the privacy-safe administrator growth report
      tags:
        - Reports
      security:
        - applicationSession: []
      parameters:
        - name: period
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AdminGrowthReportPeriodKey"
      responses:
        "200":
          description: Aggregate-only growth, supply, discovery, engagement, trust, quote, and moderation metrics.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGrowthReportResponse"
        "401":
          $ref: "#/components/responses/AdminModerationUnauthorized"
        "403":
          $ref: "#/components/responses/AdminModerationForbidden"
        "422":
          $ref: "#/components/responses/AdminModerationInvalid"
  /api/v1/admin/search-audits:
    get:
      operationId: getAdminSearchAudits
      summary: Read the last six calendar months of expression-search LLM audits
      tags:
        - Reports
      security:
        - applicationSession: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: q
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 100 }
          description: Case-insensitive prompt, normalized request, service, city, or neighborhood search.
        - name: outcome
          in: query
          required: false
          schema:
            type: string
            enum:
              [
                zero_results,
                not_understood,
                thin_results,
                operational_issue,
                healthy,
              ]
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [results_asc, gaps, newest, results_desc]
            default: results_asc
      responses:
        "200":
          description: Filtered expression prompts, LLM output, controlled parsing, analytical summary, and total matches.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSearchAuditResponse"
        "401":
          $ref: "#/components/responses/AdminModerationUnauthorized"
        "403":
          $ref: "#/components/responses/AdminModerationForbidden"
        "422":
          $ref: "#/components/responses/AdminModerationInvalid"
  /api/v1/admin/moderation/{target_type}/{target_id}/decisions:
    parameters:
      - $ref: "#/components/parameters/ModerationTargetType"
      - $ref: "#/components/parameters/ModerationTargetId"
    post:
      operationId: createAdminModerationDecision
      summary: Append an audited moderation decision and refresh the queue
      tags:
        - Moderation
      security:
        - applicationSession: []
      parameters:
        - $ref: "#/components/parameters/ModerationStatus"
        - $ref: "#/components/parameters/ModerationSearch"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/ModerationPageSize"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationDecisionRequest"
      responses:
        "200":
          description: The decision and immutable audit record were committed together.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminModerationResponse"
        "401":
          $ref: "#/components/responses/AdminModerationUnauthorized"
        "403":
          $ref: "#/components/responses/AdminModerationForbidden"
        "404":
          $ref: "#/components/responses/AdminModerationNotFound"
        "409":
          $ref: "#/components/responses/AdminModerationConflict"
        "422":
          $ref: "#/components/responses/AdminModerationInvalid"
  /api/v1/admin/verification-files/{id}/content:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getAdminVerificationFileContent
      summary: Read regenerated identity evidence through an audited response
      tags:
        - Moderation
      security:
        - applicationSession: []
      responses:
        "200":
          description: Valid retained regenerated identity evidence; access is recorded immutably.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
            Content-Disposition:
              schema:
                type: string
                pattern: '^inline; filename="berufe-identidade-[a-f0-9-]+\.(jpg|png)"'
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/AdminModerationUnauthorized"
        "404":
          description: The evidence is absent, deleted, unsafe, or not a retained regenerated identity image.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/professionals:
    get:
      operationId: getAdminProfessionals
      summary: Read the administrator directory of every professional account
      tags:
        - Professional supply
      security:
        - applicationSession: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/AdminProfessionalQuery"
        - $ref: "#/components/parameters/AdminProfessionalPhone"
        - $ref: "#/components/parameters/AdminProfessionalCity"
        - $ref: "#/components/parameters/AdminProfessionalState"
        - $ref: "#/components/parameters/AdminProfessionalIdentityVerified"
        - $ref: "#/components/parameters/AdminProfessionalOnboardingFinished"
        - $ref: "#/components/parameters/AdminProfessionalSort"
      responses:
        "200":
          description: Filtered professional accounts with directory counts, contact status, and a filtered summary.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProfessionalsResponse"
        "401":
          $ref: "#/components/responses/AdminModerationUnauthorized"
        "422":
          $ref: "#/components/responses/AdminModerationInvalid"
  /api/v1/admin/professionals/{id}/publication:
    parameters:
      - name: id
        in: path
        required: true
        description: Professional profile identifier.
        schema:
          type: string
          format: uuid
    post:
      operationId: setAdminProfessionalPublication
      summary: Restore or unpublish a professional profile and refresh the directory
      tags:
        - Professional supply
      security:
        - applicationSession: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/AdminProfessionalQuery"
        - $ref: "#/components/parameters/AdminProfessionalPhone"
        - $ref: "#/components/parameters/AdminProfessionalCity"
        - $ref: "#/components/parameters/AdminProfessionalState"
        - $ref: "#/components/parameters/AdminProfessionalIdentityVerified"
        - $ref: "#/components/parameters/AdminProfessionalOnboardingFinished"
        - $ref: "#/components/parameters/AdminProfessionalSort"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProfessionalPublicationRequest"
      responses:
        "200":
          description: The restoration or unpublication and its immutable audit record were committed together.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProfessionalsResponse"
        "401":
          $ref: "#/components/responses/AdminModerationUnauthorized"
        "403":
          $ref: "#/components/responses/AdminModerationForbidden"
        "404":
          $ref: "#/components/responses/AdminModerationNotFound"
        "409":
          $ref: "#/components/responses/AdminModerationConflict"
        "422":
          $ref: "#/components/responses/AdminModerationInvalid"
  /api/v1/catalog:
    get:
      operationId: getPublicCatalog
      summary: Read the active service catalog and cities with public supply
      tags:
        - Catalog
      security: []
      responses:
        "200":
          description: Active catalog entries in their configured order.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"
        "503":
          description: The catalog database query is temporarily unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/locations/states:
    get:
      operationId: getLocationStates
      summary: List imported Brazilian states
      tags:
        - Locations
      security: []
      responses:
        "200":
          description: States ordered by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationStatesResponse"
        "503":
          description: The location catalog is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/locations/states/{state_abbreviation}/cities:
    parameters:
      - name: state_abbreviation
        in: path
        required: true
        schema:
          type: string
          pattern: "^[A-Z]{2}$"
    get:
      operationId: getLocationCities
      summary: List imported cities for one state
      tags:
        - Locations
      security: []
      responses:
        "200":
          description: Cities ordered by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationCitiesResponse"
        "404":
          description: The state abbreviation is unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The location catalog is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/locations/cities/{city_code}/neighborhoods:
    parameters:
      - name: city_code
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9]{7}$"
    get:
      operationId: getLocationNeighborhoods
      summary: List imported official neighborhoods for one city
      tags:
        - Locations
      security: []
      responses:
        "200":
          description: Neighborhoods ordered by name; the list can be empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationNeighborhoodsResponse"
        "404":
          description: The city code is unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The location catalog is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/public/professionals/featured:
    get:
      operationId: getFeaturedPublicProfessionals
      summary: Read the most recently updated publicly eligible professionals
      tags:
        - Public discovery
      security: []
      parameters:
        - name: city_code
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]{7}$"
      responses:
        "200":
          description: Up to three publicly eligible professional cards in deterministic order.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturedPublicProfessionalsResponse"
        "503":
          description: The public professional query is temporarily unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/public/search-location:
    get:
      operationId: getPublicSearchLocation
      summary: Resolve the visitor's supported approximate search city
      tags:
        - Public discovery
      security: []
      responses:
        "200":
          description: A supported IP-derived location or the disclosed launch-city fallback.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSearchLocationResponse"
  /api/v1/public/professional-searches:
    post:
      operationId: searchPublicProfessionals
      summary: Search publicly eligible professionals from a natural-language expression
      tags:
        - Public discovery
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/PublicProfessionalSearchRequest"
                - $ref: "#/components/schemas/PublicProfessionalStructuredSearchRequest"
      responses:
        "200":
          description: Public professional cards matching the parsed service and location criteria.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfessionalSearchResponse"
        "403":
          description: The exact browser origin is invalid.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The expression is malformed or describes an unsupported or unrecognized location.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Public expression search is temporarily rate limited by the application or its LLM dependency.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The public professional query is temporarily unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/public/professional-listings:
    get:
      operationId: getPublicProfessionalListing
      summary: Read a deterministic, indexable professional listing for one service in one city
      description: >-
        A GET, cacheable counterpart to POST /public/professional-searches's
        structured mode, built for server-rendered landing pages: it neither
        records a SearchEvent nor consumes the search rate limit, and it
        reports whether Rails considers the page substantial enough to be
        indexed by search engines.
      tags:
        - Public discovery
      security: []
      parameters:
        - name: service_slug
          in: query
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        - name: state_slug
          in: query
          required: true
          schema:
            type: string
            pattern: "^[a-z]{2}$"
        - name: city_slug
          in: query
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Professional cards matching the service and city, with the page's indexability.
          headers:
