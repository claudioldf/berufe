      type: object
      additionalProperties: false
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - approved
            - rejected
            - hidden
            - restored
        reason:
          type:
            - string
            - "null"
          maxLength: 500
        note:
          type:
            - string
            - "null"
          maxLength: 500
    ModerationTargetType:
      type: string
      enum:
        - profile_revision
        - profile_photo
        - portfolio_item
        - verification_request
    ModerationStatus:
      type: string
      enum:
        - pending_review
        - approved
        - rejected
        - hidden
    CatalogData:
      type: object
      additionalProperties: false
      required:
        - categories
        - services
        - neighborhoods
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/PublicServiceCategory"
        services:
          type: array
          items:
            $ref: "#/components/schemas/PublicService"
        neighborhoods:
          type: array
          items:
            $ref: "#/components/schemas/PublicNeighborhood"
    PublicServiceCategory:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - name
        - icon
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        name:
          type: string
          minLength: 1
        icon:
          type: string
          minLength: 1
    PublicService:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - categorySlug
        - icon
        - description
        - aliases
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        categorySlug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        icon:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        aliases:
          type: array
          items:
            type: string
            minLength: 1
    PublicNeighborhood:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - stateCode
        - city
      properties:
        code:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        name:
          type: string
          minLength: 1
        stateCode:
          type: string
          const: SC
        city:
          type: string
          const: Joinville
    FeaturedPublicProfessionalsResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - request_id
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - professionals
          properties:
            professionals:
              type: array
              maxItems: 3
              items:
                $ref: "#/components/schemas/PublicProfessionalCard"
        request_id:
          $ref: "#/components/schemas/RequestId"
    PublicProfessionalSearchRequest:
      type: object
      additionalProperties: false
      required:
        - service
      properties:
        service:
          type: string
          minLength: 1
          maxLength: 80
        neighborhoodCode:
          type:
            - string
            - "null"
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 80
    PublicProfessionalSearchResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - request_id
      properties:
        data:
          $ref: "#/components/schemas/PublicProfessionalSearchData"
        request_id:
          $ref: "#/components/schemas/RequestId"
    PublicProfessionalSearchData:
      type: object
      additionalProperties: false
      required:
        - query
        - professionals
        - relatedServices
        - interaction
      properties:
        query:
          type: object
          additionalProperties: false
          required:
            - normalizedTerm
            - service
            - neighborhood
          properties:
            normalizedTerm:
              type: string
              minLength: 1
              maxLength: 80
            service:
              oneOf:
                - $ref: "#/components/schemas/PublicServiceSuggestion"
                - type: "null"
            neighborhood:
              oneOf:
                - $ref: "#/components/schemas/PublicProfessionalNeighborhoodSummary"
                - type: "null"
        professionals:
          type: array
          items:
            $ref: "#/components/schemas/PublicProfessionalCard"
        relatedServices:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/PublicServiceSuggestion"
        interaction:
          oneOf:
            - $ref: "#/components/schemas/PublicSearchInteraction"
            - type: "null"
    PublicSearchInteraction:
      type: object
      additionalProperties: false
      required:
        - searchEventId
        - token
      properties:
        searchEventId:
          type: string
          format: uuid
        token:
          type: string
          minLength: 1
    PublicServiceSuggestion:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - icon
        - description
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        icon:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
          maxLength: 240
    PublicProfessionalNeighborhoodSummary:
      type: object
      additionalProperties: false
      required:
        - code
        - name
      properties:
        code:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        name:
          type: string
          minLength: 1
    PublicProfessionalCard:
      type: object
      additionalProperties: false
      required:
        - id
        - publicSlug
        - displayName
        - headline
        - photoUrl
        - primaryService
        - matchingService
        - coverage
        - verificationLabels
        - portfolioCount
        - relationshipCount
        - publicSnapshotUpdatedAt
      properties:
        id:
          type: string
          format: uuid
        publicSlug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        displayName:
          type: string
          minLength: 3
          maxLength: 70
        headline:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 120
        photoUrl:
          type:
            - string
            - "null"
          format: uri
        primaryService:
          oneOf:
            - $ref: "#/components/schemas/PublicProfessionalServiceSummary"
            - type: "null"
        matchingService:
          oneOf:
            - $ref: "#/components/schemas/PublicProfessionalServiceSummary"
            - type: "null"
        coverage:
          $ref: "#/components/schemas/PublicProfessionalCoverage"
        verificationLabels:
          type: array
          items:
            $ref: "#/components/schemas/PublicVerificationLabel"
        portfolioCount:
          type: integer
          minimum: 0
        relationshipCount:
          type: integer
          minimum: 0
        publicSnapshotUpdatedAt:
          type:
            - string
            - "null"
          format: date-time
    PublicProfessionalServiceSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    PublicProfessionalCoverage:
      type: object
      additionalProperties: false
      required:
        - allJoinville
        - neighborhoods
      properties:
        allJoinville:
          type: boolean
        neighborhoods:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - code
              - name
            properties:
              code:
                type: string
                pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
              name:
                type: string
                minLength: 1
    PublicVerificationLabel:
      type: object
      additionalProperties: false
      required:
        - type
        - label
        - verifiedAt
      properties:
        type:
          type: string
          enum:
            - phone
            - identity
        label:
          type: string
          enum:
            - Telefone confirmado
            - Identidade verificada
        verifiedAt:
          type:
            - string
            - "null"
          format: date-time
    RequestId:
      type: string
      pattern: "^[A-Za-z0-9._-]{1,100}$"
    StatusResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - request_id
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - service
            - status
          properties:
            service:
              type: string
              const: berufe-api
            status:
              type: string
              const: ok
        request_id:
          $ref: "#/components/schemas/RequestId"
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
          pattern: "^[a-z0-9_]+$"
        message:
          type: string
          minLength: 1
        field_errors:
          type: object
          additionalProperties:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
        request_id:
          $ref: "#/components/schemas/RequestId"
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/Error"
    PageMeta:
      type: object
      additionalProperties: false
      required:
        - page
        - per_page
        - total_count
        - total_pages
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        total_count:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
security:
  - applicationSession: []
tags:
  - name: Authentication
  - name: Catalog
  - name: Foundation
  - name: Moderation
  - name: Professional supply
