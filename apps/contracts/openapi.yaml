            - display_name
            - photo_url
          properties:
            id:
              type: string
              format: uuid
            public_slug:
              type: string
              pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
            display_name:
              type: string
              minLength: 3
              maxLength: 70
            photo_url:
              type:
                - string
                - "null"
              format: uri
    PublicProfessionalSocialLinks:
      type: object
      additionalProperties: false
      required:
        - instagram
        - youtube
      properties:
        instagram:
          type:
            - string
            - "null"
          format: uri
        youtube:
          type:
            - string
            - "null"
          format: uri
    PublicProfileInteraction:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 2048
    PublicProfessionalViewRequest:
      type: object
      additionalProperties: false
      required:
        - interaction_token
      properties:
        interaction_token:
          type: string
          minLength: 1
          maxLength: 2048
    RequestId:
      type: string
      pattern: "^[A-Za-z0-9._-]{1,100}$"
    StatusResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - request_id
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - service
            - status
          properties:
            service:
              type: string
              const: berufe-api
            status:
              type: string
              const: ok
        request_id:
          $ref: "#/components/schemas/RequestId"
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
          pattern: "^[a-z0-9_]+$"
        message:
          type: string
          minLength: 1
        field_errors:
          type: object
          additionalProperties:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
        request_id:
          $ref: "#/components/schemas/RequestId"
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/Error"
    PageMeta:
      type: object
      additionalProperties: false
      required:
        - page
        - per_page
        - total_count
        - total_pages
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        total_count:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
