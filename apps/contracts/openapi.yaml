openapi: 3.1.0
info:
  title: Berufe API
  version: 1.0.0
  description: Contract for the Berufe MVP Rails API.
servers:
  - url: /
paths:
  /api/v1/auth/otp/challenges:
    post:
      operationId: requestPhoneOtp
      summary: Request a Brazilian phone OTP challenge
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneOtpRequest"
      responses:
        "201":
          description: The SMS provider accepted the challenge synchronously.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneOtpChallengeResponse"
        "403":
          description: The exact browser origin is invalid.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The phone is invalid or SMS delivery was rejected.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: A Rails or provider cooldown/daily allowance was reached.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The SMS provider or challenge persistence is unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/otp/verifications:
    post:
      operationId: verifyPhoneOtp
      summary: Verify a phone OTP and create an application session
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneOtpVerificationRequest"
      responses:
        "200":
          description: The provider verified the code and Rails created an application session.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/ApplicationSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneOtpVerificationResponse"
        "403":
          description: The exact browser origin is invalid.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The code or browser challenge is invalid, expired, or consumed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The provider or session persistence is unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/session:
    post:
      operationId: createAdminSession
      summary: Authenticate a deliberately provisioned administrator with email and password
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSessionRequest"
      responses:
        "200":
          description: The credentials were accepted and Rails created an administrator session.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/ApplicationSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionResponse"
        "401":
          description: The credentials are invalid or the administrator is unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The exact browser origin is invalid.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The email or source address reached its login-attempt allowance.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Administrator authentication persistence is temporarily unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/catalog:
    get:
      operationId: getAdminCatalog
      summary: Read the complete administrator-managed catalog
      tags:
        - Catalog
      security:
        - applicationSession: []
      responses:
        "200":
          description: Active and inactive catalog entries in their configured order.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogResponse"
        "401":
          $ref: "#/components/responses/AdminCatalogUnauthorized"
        "503":
          $ref: "#/components/responses/AdminCatalogUnavailable"
  /api/v1/admin/catalog/services:
    post:
      operationId: createAdminCatalogService
      summary: Add a service to the controlled catalog
      tags:
        - Catalog
      security:
        - applicationSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCatalogServiceCreateRequest"
      responses:
        "201":
          description: The service was appended to the controlled catalog.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogResponse"
        "401":
          $ref: "#/components/responses/AdminCatalogUnauthorized"
        "403":
          $ref: "#/components/responses/AdminCatalogForbidden"
        "404":
          $ref: "#/components/responses/AdminCatalogNotFound"
        "409":
          $ref: "#/components/responses/AdminCatalogConflict"
        "422":
          $ref: "#/components/responses/AdminCatalogInvalid"
        "503":
          $ref: "#/components/responses/AdminCatalogUnavailable"
  /api/v1/admin/catalog/services/order:
    put:
      operationId: reorderAdminCatalogServices
      summary: Persist the complete deterministic service order
      tags:
        - Catalog
      security:
        - applicationSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCatalogServiceOrderRequest"
      responses:
        "200":
          description: The complete service order was persisted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogResponse"
        "401":
          $ref: "#/components/responses/AdminCatalogUnauthorized"
        "403":
          $ref: "#/components/responses/AdminCatalogForbidden"
        "409":
          $ref: "#/components/responses/AdminCatalogConflict"
        "503":
          $ref: "#/components/responses/AdminCatalogUnavailable"
  /api/v1/admin/catalog/services/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateAdminCatalogService
      summary: Update mutable fields of a controlled service
      tags:
        - Catalog
      security:
        - applicationSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCatalogServiceUpdateRequest"
      responses:
        "200":
          description: The service was updated without changing its stable slug.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogResponse"
        "401":
          $ref: "#/components/responses/AdminCatalogUnauthorized"
        "403":
          $ref: "#/components/responses/AdminCatalogForbidden"
        "404":
          $ref: "#/components/responses/AdminCatalogNotFound"
        "422":
          $ref: "#/components/responses/AdminCatalogInvalid"
        "503":
          $ref: "#/components/responses/AdminCatalogUnavailable"
  /api/v1/admin/catalog/neighborhoods:
    post:
      operationId: createAdminCatalogNeighborhood
      summary: Add a Joinville neighborhood to the controlled catalog
      tags:
        - Catalog
      security:
        - applicationSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCatalogNeighborhoodCreateRequest"
      responses:
        "201":
          description: The neighborhood was appended to the controlled catalog.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogResponse"
        "401":
          $ref: "#/components/responses/AdminCatalogUnauthorized"
        "403":
          $ref: "#/components/responses/AdminCatalogForbidden"
        "409":
          $ref: "#/components/responses/AdminCatalogConflict"
        "422":
          $ref: "#/components/responses/AdminCatalogInvalid"
        "503":
          $ref: "#/components/responses/AdminCatalogUnavailable"
  /api/v1/admin/catalog/neighborhoods/order:
    put:
      operationId: reorderAdminCatalogNeighborhoods
      summary: Persist the complete deterministic neighborhood order
      tags:
        - Catalog
      security:
        - applicationSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCatalogNeighborhoodOrderRequest"
      responses:
        "200":
          description: The complete neighborhood order was persisted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogResponse"
        "401":
          $ref: "#/components/responses/AdminCatalogUnauthorized"
        "403":
          $ref: "#/components/responses/AdminCatalogForbidden"
        "409":
          $ref: "#/components/responses/AdminCatalogConflict"
        "503":
          $ref: "#/components/responses/AdminCatalogUnavailable"
  /api/v1/admin/catalog/neighborhoods/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 80
    patch:
      operationId: updateAdminCatalogNeighborhood
      summary: Update mutable fields of a controlled Joinville neighborhood
      tags:
        - Catalog
      security:
        - applicationSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCatalogNeighborhoodUpdateRequest"
      responses:
        "200":
          description: The neighborhood was updated without changing its stable code.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogResponse"
        "401":
          $ref: "#/components/responses/AdminCatalogUnauthorized"
        "403":
          $ref: "#/components/responses/AdminCatalogForbidden"
        "404":
          $ref: "#/components/responses/AdminCatalogNotFound"
        "409":
          $ref: "#/components/responses/AdminCatalogConflict"
        "422":
          $ref: "#/components/responses/AdminCatalogInvalid"
        "503":
          $ref: "#/components/responses/AdminCatalogUnavailable"
  /api/v1/admin/moderation:
    get:
      operationId: getAdminModerationQueue
      summary: Read the shared professional-supply moderation queue
      tags:
        - Moderation
      security:
        - applicationSession: []
      parameters:
        - $ref: "#/components/parameters/ModerationType"
        - $ref: "#/components/parameters/ModerationStatus"
        - $ref: "#/components/parameters/ModerationSearch"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/ModerationPageSize"
      responses:
        "200":
          description: Oldest-first moderation work and server-owned summary counts.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminModerationResponse"
        "401":
          $ref: "#/components/responses/AdminModerationUnauthorized"
        "422":
          $ref: "#/components/responses/AdminModerationInvalid"
  /api/v1/admin/moderation/{target_type}/{target_id}/decisions:
    parameters:
      - $ref: "#/components/parameters/ModerationTargetType"
      - $ref: "#/components/parameters/ModerationTargetId"
    post:
      operationId: createAdminModerationDecision
      summary: Append an audited moderation decision and refresh the queue
      tags:
        - Moderation
      security:
        - applicationSession: []
      parameters:
        - $ref: "#/components/parameters/ModerationType"
        - $ref: "#/components/parameters/ModerationStatus"
        - $ref: "#/components/parameters/ModerationSearch"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/ModerationPageSize"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationDecisionRequest"
      responses:
        "200":
          description: The decision and immutable audit record were committed together.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminModerationResponse"
        "401":
          $ref: "#/components/responses/AdminModerationUnauthorized"
        "403":
          $ref: "#/components/responses/AdminModerationForbidden"
        "404":
          $ref: "#/components/responses/AdminModerationNotFound"
        "409":
          $ref: "#/components/responses/AdminModerationConflict"
        "422":
          $ref: "#/components/responses/AdminModerationInvalid"
  /api/v1/admin/moderation/{target_type}/{target_id}/media:
    parameters:
      - $ref: "#/components/parameters/ModerationMediaTargetType"
      - $ref: "#/components/parameters/ModerationTargetId"
    get:
      operationId: getAdminModerationMedia
      summary: Read a regenerated private image for in-place moderation preview
      tags:
        - Moderation
      security:
        - applicationSession: []
      responses:
        "200":
          description: The regenerated private image; access is recorded immutably.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
            Content-Disposition:
              schema:
                type: string
                pattern: '^inline; filename="berufe-analise-(profile_photo|portfolio_item)-[a-f0-9-]+\.(jpg|png)"'
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/AdminModerationUnauthorized"
        "404":
          $ref: "#/components/responses/AdminModerationNotFound"
  /api/v1/admin/verification-files/{id}/content:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getAdminVerificationFileContent
      summary: Read regenerated identity evidence through an audited response
      tags:
        - Moderation
      security:
        - applicationSession: []
      responses:
        "200":
          description: Valid retained regenerated identity evidence; access is recorded immutably.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
            Content-Disposition:
              schema:
                type: string
                pattern: '^inline; filename="berufe-identidade-[a-f0-9-]+\.(jpg|png)"'
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/AdminModerationUnauthorized"
        "404":
          description: The evidence is absent, deleted, unsafe, or not a retained regenerated identity image.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/catalog:
    get:
      operationId: getPublicCatalog
      summary: Read the active service and Joinville neighborhood catalog
      tags:
        - Catalog
      security: []
      responses:
        "200":
          description: Active catalog entries in their configured order.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"
        "503":
          description: The catalog database query is temporarily unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/public/professionals/featured:
    get:
      operationId: getFeaturedPublicProfessionals
      summary: Read the most recently approved publicly eligible professionals
      tags:
        - Public discovery
      security: []
      responses:
        "200":
          description: Up to three publicly eligible professional cards in deterministic order.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturedPublicProfessionalsResponse"
        "503":
          description: The public professional query is temporarily unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/public/professional-searches:
    post:
      operationId: searchPublicProfessionals
      summary: Search publicly eligible professionals by service and optional Joinville neighborhood
      tags:
        - Public discovery
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicProfessionalSearchRequest"
      responses:
        "200":
          description: Matching public professional cards or safe related active-service suggestions.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfessionalSearchResponse"
        "403":
          description: The exact browser origin is invalid.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The service term or optional neighborhood is malformed or unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The public professional query is temporarily unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/public/profile-photos/{id}/image:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getPublicProfilePhotoImage
      summary: Read a currently published approved profile photo
      tags:
        - Public discovery
      security: []
      responses:
        "200":
          description: An approved JPEG profile photo whose parent remains publicly eligible.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              schema:
                type: string
                const: max-age=0, public, must-revalidate
            Content-Disposition:
              schema:
                type: string
                pattern: '^inline; filename="berufe-profile-photo-[a-f0-9-]+\.jpg"'
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: The photo is absent, not approved/published, has an ineligible parent, or its object is unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/public/portfolio-items/{id}/image:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getPublicPortfolioItemImage
      summary: Read the approved regenerated portfolio image
      tags:
        - Professional supply
      security: []
      responses:
        "200":
          description: An approved portfolio image that remains eligible for public display.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              schema:
                type: string
                const: max-age=0, public, must-revalidate
            Content-Disposition:
              schema:
                type: string
                pattern: '^inline; filename="berufe-portfolio-[a-f0-9-]+\.(jpg|png)"'
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: The portfolio item is not approved, was hidden/deleted, or its public object is unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/professional-registration:
    put:
      operationId: completeProfessionalRegistration
      summary: Accept the current legal documents and create one draft professional profile
      tags:
        - Authentication
      security:
        - applicationSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfessionalRegistrationRequest"
      responses:
        "200":
          description: Registration is complete and the account owns exactly one draft profile.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessionalRegistrationResponse"
        "401":
          description: An active Rails application session is required.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The account role or exact request origin is not permitted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The display name or legal acceptance is invalid.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Registration persistence is temporarily unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/professional/workspace:
    get:
      operationId: getProfessionalWorkspace
      summary: Read the authenticated professional's server-owned workspace
      tags:
        - Professional supply
      security:
        - applicationSession: []
      responses:
        "200":
          description: The owned professional profile and its current editable identity.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessionalWorkspaceResponse"
        "401":
          description: An active Rails application session is required.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Professional registration has not created a profile yet.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
