          verification_label,
        ]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string, minLength: 1, maxLength: 80 }
        recommendation_text: { type: string, minLength: 1, maxLength: 700 }
        submitted_at: { type: string, format: date-time }
        verification_label:
          { type: string, enum: ["Link enviado por e-mail", "Link enviado por WhatsApp"] }
