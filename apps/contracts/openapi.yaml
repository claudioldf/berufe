components:
  securitySchemes:
    applicationSession:
      type: apiKey
      in: cookie
      name: __Host-berufe_session
      description: Opaque Rails-owned application-session cookie.
  headers:
    ApplicationSessionCookie:
      description: Host-only opaque Rails application-session cookie.
      schema:
        type: string
        minLength: 1
    RequestId:
      description: Bounded request identifier used for safe cross-service correlation.
      schema:
        $ref: "#/components/schemas/RequestId"
    RetryAfter:
      description: Whole seconds before another rate-limited request may be attempted.
      schema:
        type: integer
        minimum: 1
  parameters:
    Page:
      name: page
      in: query
      description: One-based result page.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: per_page
      in: query
      description: Result count per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Order:
      name: order
      in: query
      required: true
      description: Endpoint-specific deterministic ordering key.
      schema:
        type: string
        minLength: 1
    MediaUploadId:
      name: id
      in: path
      required: true
      description: Opaque server-generated media upload identifier.
      schema:
        type: string
        format: uuid
    ModerationType:
      name: type
      in: query
      description: Moderation target family shown by the existing type control.
      schema:
        type: string
        default: all
        enum:
          - all
          - profile_revision
          - profile_photo
          - portfolio_item
          - verification_request
    ModerationStatus:
      name: status
      in: query
      description: Moderation workflow state.
      schema:
        type: string
        default: pending_review
        enum:
          - pending_review
          - approved
          - rejected
          - hidden
          - all
    ModerationSearch:
      name: search
      in: query
      description: Accent-insensitive search across the safe queue presentation.
      schema:
        type: string
        maxLength: 100
    ModerationPageSize:
      name: per_page
      in: query
      description: Moderation result count per page.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    ModerationTargetType:
      name: target_type
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ModerationTargetType"
    ModerationMediaTargetType:
      name: target_type
      in: path
      required: true
      schema:
        type: string
        enum:
          - profile_photo
          - portfolio_item
    ModerationTargetId:
      name: target_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ProfessionalMediaUnauthorized:
      description: An active Rails application session is required.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProfessionalMediaForbidden:
      description: The exact browser origin or professional ownership check failed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProfessionalMediaNotFound:
      description: The professional profile or owned media upload does not exist.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProfessionalMediaConflict:
      description: The media upload is not in a state that permits this transition.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProfessionalMediaInvalid:
      description: The declaration, authorization, or uploaded object is invalid.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProfessionalMediaUnavailable:
      description: Private media storage or asynchronous processing is temporarily unavailable.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminCatalogUnauthorized:
      description: An active password-authenticated administrator session is required.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminCatalogForbidden:
      description: The account or exact request origin is not permitted.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminCatalogNotFound:
      description: The requested entry or controlled category does not exist.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminCatalogConflict:
      description: A stable identifier conflicts or the submitted order is stale or incomplete.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminCatalogInvalid:
      description: One or more catalog fields are invalid.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminCatalogUnavailable:
      description: Catalog persistence is temporarily unavailable.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminModerationUnauthorized:
      description: An active password-authenticated administrator session is required.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminModerationForbidden:
      description: The exact browser origin or administrator account is not permitted.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminModerationNotFound:
      description: The moderation target or regenerated private image does not exist.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminModerationConflict:
      description: The moderation target changed and no longer permits this decision.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminModerationInvalid:
      description: One or more queue filters or decision fields are invalid.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    AdminSessionRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 72
    AdminSessionResponse:
      type: object
