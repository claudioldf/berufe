            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadResponse"
        "401":
          $ref: "#/components/responses/ProfessionalMediaUnauthorized"
        "403":
          $ref: "#/components/responses/ProfessionalMediaForbidden"
        "404":
          $ref: "#/components/responses/ProfessionalMediaNotFound"
        "409":
          $ref: "#/components/responses/ProfessionalMediaConflict"
        "503":
          $ref: "#/components/responses/ProfessionalMediaUnavailable"
  /api/v1/professional/data-erasure-request:
    post:
      operationId: requestProfessionalDataErasure
      summary: Irreversibly unpublish and queue erasure of the authenticated professional account
      tags:
        - Professional account
      security:
        - applicationSession: []
      responses:
        "202":
          description: The profile and shared links were disabled immediately and erasure was queued.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/ApplicationSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataErasureSubmissionResponse"
        "401":
          description: The application session is missing or no longer active.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The exact browser origin is invalid or the account is not an eligible professional.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The erasure request could not be persisted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/data-erasure-requests/{status_token}:
    parameters:
      - name: status_token
        in: path
        required: true
        schema:
          type: string
          pattern: "^be_[A-Za-z0-9_-]{43}$"
    get:
      operationId: getDataErasureRequestStatus
      summary: Read a privacy-safe erasure status using its opaque bearer token
      tags:
        - Privacy
      security: []
      responses:
        "200":
          description: The request status without account or subject identifiers.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataErasureStatusResponse"
        "404":
          description: The token is invalid, unknown, or its minimal retention period ended.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The request status is temporarily unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/session:
    get:
      operationId: getCurrentSession
      summary: Restore the current Rails application session
      tags:
        - Authentication
      security:
        - applicationSession: []
      responses:
        "200":
          description: The active account and session summary.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSessionResponse"
        "401":
          description: The cookie is missing, unknown, expired, revoked, or belongs to a suspended account.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The authenticated account is not authorized to inspect this session.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The application-session database operation is unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: endCurrentSession
      summary: Revoke the current Rails application session
      tags:
        - Authentication
      security:
        - applicationSession: []
      responses:
        "204":
          description: The current session was revoked and its cookie was cleared.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/ApplicationSessionCookie"
        "401":
          description: The cookie is missing, unknown, expired, revoked, or belongs to a suspended account.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The exact request origin is invalid.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The application-session database operation is unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/status:
    get:
      operationId: getApiStatus
      summary: Read API and database readiness
      tags:
        - Foundation
      security: []
      responses:
        "200":
          description: The API and its database are ready.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "503":
          description: The API cannot currently reach a required dependency.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    applicationSession:
      type: apiKey
      in: cookie
      name: __Host-berufe_session
      description: Opaque Rails-owned application-session cookie.
  headers:
    ApplicationSessionCookie:
      description: Host-only opaque Rails application-session cookie.
      schema:
        type: string
        minLength: 1
    RequestId:
      description: Bounded request identifier used for safe cross-service correlation.
      schema:
        $ref: "#/components/schemas/RequestId"
    RetryAfter:
      description: Whole seconds before another rate-limited request may be attempted.
      schema:
        type: integer
        minimum: 1
  parameters:
    Page:
      name: page
      in: query
      description: One-based result page.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: per_page
      in: query
      description: Result count per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Order:
      name: order
      in: query
      required: true
      description: Endpoint-specific deterministic ordering key.
      schema:
        type: string
        minLength: 1
    MediaUploadId:
      name: id
      in: path
      required: true
      description: Opaque server-generated media upload identifier.
      schema:
        type: string
        format: uuid
    ModerationStatus:
      name: status
      in: query
      description: Moderation workflow state.
      schema:
        type: string
        default: pending_review
        enum:
          - pending_review
          - approved
          - rejected
          - all
    ModerationSearch:
      name: search
      in: query
      description: Accent-insensitive search across the safe queue presentation.
      schema:
        type: string
        maxLength: 100
    ModerationPageSize:
      name: per_page
      in: query
      description: Moderation result count per page.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    ProfessionalQuoteSearch:
      name: search
      in: query
      description: Accent-insensitive search by quote number, customer, or service.
      schema:
        type: string
        maxLength: 100
    ProfessionalCustomerSearch:
      name: search
      in: query
      description: Accent-insensitive search by customer name, email, or WhatsApp digits.
      schema:
        type: string
        maxLength: 100
    ProfessionalQuoteCustomerId:
      name: customer_id
      in: query
      description: Return only quotes associated with this owner-scoped customer.
      schema:
        type: string
        format: uuid
    ProfessionalQuoteStatus:
      name: status
      in: query
      description: Quote workflow status; defaults to all statuses.
      schema:
        type: string
        default: all
        enum:
          - all
          - draft
          - saved
          - shared
          - change_requested
          - approved
          - declined
    ProfessionalQuoteScheduledOn:
      name: scheduled_on
      in: query
      description: Exact combined service date.
      schema:
        type: string
        format: date
    ProfessionalQuoteSort:
      name: sort
      in: query
      description: Quote table column used for deterministic ordering.
      schema:
        type: string
        default: updated
        enum:
          - number
          - customer
          - total
          - status
          - updated
    SortDirection:
      name: direction
      in: query
      description: Sort direction for the selected column.
      schema:
        type: string
        default: desc
        enum:
          - asc
          - desc
    ModerationTargetType:
      name: target_type
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ModerationTargetType"
    ModerationTargetId:
      name: target_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdminProfessionalQuery:
      name: q
      in: query
      description: Case-insensitive, accent-insensitive professional name search.
      schema:
        type: string
        maxLength: 100
    AdminProfessionalPhone:
      name: phone
      in: query
      description: Digits-matched search across the account and coverage WhatsApp numbers.
      schema:
        type: string
        maxLength: 20
    AdminProfessionalCity:
      name: city
      in: query
      description: IBGE city code of the professional's coverage area.
      schema:
        type: string
        pattern: "^[0-9]{7}$"
    AdminProfessionalState:
      name: state
      in: query
      description: Two-letter state abbreviation of the professional's coverage area.
      schema:
        type: string
        pattern: "^[A-Z]{2}$"
    AdminProfessionalIdentityVerified:
      name: identity_verified
      in: query
      description: Filter by approved identity verification.
      schema:
        type: string
        default: all
        enum: [all, "yes", "no"]
    AdminProfessionalOnboardingFinished:
      name: onboarding_finished
      in: query
      description: Filter by whether the professional submitted their profile at least once.
      schema:
        type: string
        default: all
        enum: [all, "yes", "no"]
    AdminProfessionalSort:
      name: sort
      in: query
      description: Directory table column used for deterministic ordering.
      schema:
        type: string
        default: recent
        enum: [recent, last_login_desc, name_asc]
  responses:
    ProfessionalMediaUnauthorized:
      description: An active Rails application session is required.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProfessionalMediaForbidden:
      description: The exact browser origin or professional ownership check failed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProfessionalMediaNotFound:
      description: The professional profile or owned media upload does not exist.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProfessionalMediaConflict:
      description: The media upload is not in a state that permits this transition.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProfessionalMediaInvalid:
      description: The declaration, authorization, or uploaded object is invalid.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProfessionalMediaUnavailable:
      description: Private media storage or asynchronous processing is temporarily unavailable.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminCatalogUnauthorized:
      description: An active password-authenticated administrator session is required.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminCatalogForbidden:
      description: The account or exact request origin is not permitted.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminCatalogNotFound:
      description: The requested entry or controlled category does not exist.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminCatalogConflict:
      description: A stable identifier conflicts or the submitted order is stale or incomplete.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminCatalogInvalid:
      description: One or more catalog fields are invalid.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminCatalogUnavailable:
      description: Catalog persistence is temporarily unavailable.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminModerationUnauthorized:
      description: An active password-authenticated administrator session is required.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminModerationForbidden:
      description: The exact browser origin or administrator account is not permitted.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminModerationNotFound:
      description: The identity request or retained private document does not exist.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminModerationConflict:
      description: The moderation target changed and no longer permits this decision.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminModerationInvalid:
      description: One or more queue filters or decision fields are invalid.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    AdminSearchAuditResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/AdminSearchAuditData"
        request_id:
          $ref: "#/components/schemas/RequestId"
    AdminSearchAuditData:
      type: object
      additionalProperties: false
      required: [items, summary, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminSearchAuditItem"
        summary:
          $ref: "#/components/schemas/AdminSearchAuditSummary"
        meta:
          $ref: "#/components/schemas/PageMeta"
    AdminSearchAuditSummary:
      type: object
      additionalProperties: false
      required:
        [
          total,
          zero_results,
          not_understood,
          thin_results,
          operational_issue,
          healthy,
        ]
      properties:
        total: { type: integer, minimum: 0 }
        zero_results: { type: integer, minimum: 0 }
        not_understood: { type: integer, minimum: 0 }
        thin_results: { type: integer, minimum: 0 }
        operational_issue: { type: integer, minimum: 0 }
        healthy: { type: integer, minimum: 0 }
    AdminSearchAuditItem:
      type: object
      additionalProperties: false
      required:
        [
          id,
          input_prompt,
          raw_llm_response,
          parsed_response,
          status,
          response_source,
          adapter,
          model,
          provider_request_id,
          prompt_digest,
          result_count,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        input_prompt: { type: string, minLength: 1, maxLength: 200 }
        raw_llm_response: { type: [string, "null"] }
        parsed_response:
          oneOf:
            - $ref: "#/components/schemas/AdminSearchAuditParsedResponse"
            - type: "null"
        status:
          type: string
          enum:
            [
              processing,
              completed,
              application_rate_limited,
              provider_rate_limited,
              provider_unavailable,
              response_rejected,
              search_failed,
            ]
        response_source:
          type: [string, "null"]
          enum: [provider, cache, null]
        adapter: { type: [string, "null"] }
        model: { type: [string, "null"] }
        provider_request_id: { type: [string, "null"] }
        prompt_digest:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
        result_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
    AdminSearchAuditParsedResponse:
      type: object
      additionalProperties: false
      required: [service_ids, services, locations, keywords, normalized_request]
      properties:
        service_ids:
          type: array
          items: { type: string, format: uuid }
        services:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string, minLength: 1 }
        locations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [state_code, city, neighborhood]
            properties:
              state_code: { type: string, minLength: 2, maxLength: 2 }
              city: { type: string, minLength: 1 }
              neighborhood:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [code, name]
                    properties:
                      code: { type: string, minLength: 1 }
                      name: { type: string, minLength: 1 }
                  - type: "null"
        keywords:
          type: array
          items: { type: string }
        normalized_request:
          type: [string, "null"]
          maxLength: 240
    AdminProfessionalsResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/AdminProfessionalsData"
        request_id:
          $ref: "#/components/schemas/RequestId"
    AdminProfessionalsData:
      type: object
      additionalProperties: false
      required: [items, summary, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminProfessionalItem"
        summary:
          $ref: "#/components/schemas/AdminProfessionalsSummary"
        meta:
          $ref: "#/components/schemas/PageMeta"
    AdminProfessionalsSummary:
      type: object
      additionalProperties: false
      required:
        [total, published, suspended, onboarding_finished, identity_verified]
      properties:
        total: { type: integer, minimum: 0 }
        published: { type: integer, minimum: 0 }
        suspended: { type: integer, minimum: 0 }
        onboarding_finished: { type: integer, minimum: 0 }
        identity_verified: { type: integer, minimum: 0 }
    AdminProfessionalItem:
      type: object
      additionalProperties: false
      required:
        - id
        - professional_profile_id
        - public_slug
        - display_name
        - profile_status
        - city
        - state
        - phone_verified
        - phone_last4
        - identity_verified
        - account_status
        - portfolio_count
        - reference_count
        - customer_count
        - quote_count
        - registered_at
        - last_login_at
        - login_count
        - published_at
      properties:
        id: { type: string, format: uuid }
        professional_profile_id: { type: [string, "null"], format: uuid }
        public_slug: { type: [string, "null"] }
        display_name: { type: [string, "null"] }
        profile_status:
          type: [string, "null"]
          enum: [draft, published, suspended, null]
        city: { type: [string, "null"] }
        state: { type: [string, "null"], minLength: 2, maxLength: 2 }
        phone_verified: { type: boolean }
        phone_last4:
          type: [string, "null"]
          pattern: "^[0-9]{4}$"
        identity_verified: { type: boolean }
        account_status:
          type: string
          enum: [active, suspended]
        portfolio_count: { type: integer, minimum: 0 }
        reference_count: { type: integer, minimum: 0 }
        customer_count: { type: integer, minimum: 0 }
        quote_count: { type: integer, minimum: 0 }
        registered_at: { type: [string, "null"], format: date-time }
        last_login_at: { type: [string, "null"], format: date-time }
        login_count: { type: integer, minimum: 0 }
        published_at: { type: [string, "null"], format: date-time }
    AdminProfessionalPublicationRequest:
      type: object
      additionalProperties: false
      required:
        - publication
      properties:
        publication:
          $ref: "#/components/schemas/AdminProfessionalPublicationInput"
    AdminProfessionalPublicationInput:
      type: object
      additionalProperties: false
      required:
        - published
      properties:
        published:
          type: boolean
        reason:
          type: [string, "null"]
          description: User-visible reason required when unpublishing; omit when restoring.
          minLength: 10
          maxLength: 500
    AdminGrowthReportPeriodKey:
      type: string
      enum: [since_launch, last_30_days, last_7_days]
    AdminGrowthReportResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/AdminGrowthReportData"
        request_id:
          $ref: "#/components/schemas/RequestId"
    AdminGrowthReportData:
      type: object
      additionalProperties: false
      required:
        [
          generated_at,
          period,
          privacy_notice,
          summary,
          supply,
          discovery,
          engagement,
          trust,
          quotes,
          moderation,
        ]
      properties:
        generated_at: { type: string, format: date-time }
        period: { $ref: "#/components/schemas/AdminGrowthReportPeriod" }
        privacy_notice: { type: string }
        summary: { $ref: "#/components/schemas/AdminGrowthReportSummary" }
        supply: { $ref: "#/components/schemas/AdminGrowthReportSupply" }
        discovery: { $ref: "#/components/schemas/AdminGrowthReportDiscovery" }
        engagement: { $ref: "#/components/schemas/AdminGrowthReportEngagement" }
        trust: { $ref: "#/components/schemas/AdminGrowthReportTrust" }
        quotes: { $ref: "#/components/schemas/AdminGrowthReportQuotes" }
        moderation: { $ref: "#/components/schemas/AdminGrowthReportModeration" }
    AdminGrowthReportPeriod:
      type: object
      additionalProperties: false
      required:
        [
          key,
          label,
          short_label,
          window_label,
          start_at,
          end_at,
          truncated,
          data_available_from,
        ]
      properties:
        key: { $ref: "#/components/schemas/AdminGrowthReportPeriodKey" }
        label: { type: string }
        short_label: { type: string }
        window_label: { type: string }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        truncated: { type: boolean }
        data_available_from: { type: string, format: date }
    AdminGrowthReportRate:
      type: object
      required: [numerator, denominator, rate]
      properties:
        numerator: { type: integer, minimum: 0 }
        denominator: { type: integer, minimum: 0 }
        rate:
          type: [number, "null"]
          minimum: 0
          maximum: 1
    AdminGrowthReportComparison:
      type: object
      additionalProperties: false
      required: [kind, reached, next, delta, directional]
      properties:
        kind:
          type: string
          enum: [milestone, count, percentage_points]
        reached: { type: [number, "null"], minimum: 0 }
        next: { type: [number, "null"], minimum: 0 }
        delta: { type: [number, "null"] }
        directional: { type: boolean }
    AdminGrowthReportSummary:
      type: object
      additionalProperties: false
      required: [published, activated, search_coverage, handoffs, returning]
      properties:
        published:
